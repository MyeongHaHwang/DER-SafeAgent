# Dry-run recipe — Qwen2.5-0.5B-Instruct.
# Use only for pipeline validation; quality results require the 7B/8B configs.
model: Qwen/Qwen2.5-0.5B-Instruct
seed: 0
max_len: 1024

data:
  train: ../finetuning_dataset/processed/train.jsonl
  val:   ../finetuning_dataset/processed/val.jsonl
  test:  ../finetuning_dataset/processed/test.jsonl

lora:
  r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  bias: none
  task_type: CAUSAL_LM
  target_modules: [q_proj, k_proj, v_proj, o_proj]

training:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  lr_scheduler_type: cosine
  warmup_ratio: 0.0
  weight_decay: 0.0
  logging_steps: 5
  eval_strategy: "no"
  save_strategy: "no"
  gradient_checkpointing: false
  max_steps: 10
